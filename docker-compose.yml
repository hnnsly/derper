services:
  derper:
    image: ghcr.io/hnnsly/derper:latest
    container_name: derper
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "3478:3478/udp"
    volumes:
      - derper-data:/var/lib/derper
    command:
      - --hostname=derp.example.com
      - --certmode=letsencrypt
      - --verify-clients=false

volumes:
  derper-data:
