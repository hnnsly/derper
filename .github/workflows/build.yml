name: Build and Publish DERP Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Multi-Arch Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tailscale version
        id: tailscale_version
        run: |
          VERSION=$(grep -E '^\s*tailscale\.com\s+' go.mod | awk '{print $2}')
          echo "RAW_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          # Strip leading 'v' for numeric tag
          CLEAN_VERSION="${VERSION#v}"
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Tag with latest on push to default branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # Tag with exact Tailscale versions (e.g. v1.104.1 and 1.104.1)
            type=raw,value=${{ steps.tailscale_version.outputs.RAW_VERSION }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.tailscale_version.outputs.RAW_VERSION != '' }}
            type=raw,value=${{ steps.tailscale_version.outputs.CLEAN_VERSION }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.tailscale_version.outputs.CLEAN_VERSION != '' }}
            # Git tags if pushed
            type=ref,event=tag
            # Short commit SHA
            type=sha,format=short
            # PR branch tag for pull requests
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
